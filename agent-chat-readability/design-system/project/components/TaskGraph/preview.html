<!-- @dsCard group="图" height=300 subtitle="单色 DAG：唯一的颜色是当前路径" -->
<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-md);font-weight:var(--fw-body);line-height:var(--lh-body)}</style></head><body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-pending" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol><symbol id="i-running" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".25"/><path d="M6 1.5a4.5 4.5 0 0 1 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol><symbol id="i-done" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="currentColor"/><path d="M3.6 6.2l1.7 1.6 3.2-3.4" fill="none" style="stroke:var(--bg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-failed" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="currentColor"/><path d="M4 4l4 4M8 4l-4 4" style="stroke:var(--bg)" stroke-width="1.5" stroke-linecap="round"/></symbol><symbol id="i-waiting" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 3.3V6l1.9 1.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol><symbol id="i-skipped" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 6h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol><symbol id="i-chev" viewBox="0 0 12 12"><path d="M4 2.5L7.5 6 4 9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-info" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 8v4.5M9 5.5v.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol><symbol id="i-warn" viewBox="0 0 18 18"><path d="M9 2.5l7 12.5H2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 7v3.5M9 13v.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol><symbol id="i-err" viewBox="0 0 18 18"><rect x="2.5" y="2.5" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 6.5l5 5M11.5 6.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol><symbol id="i-ok" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.8 9.3l2.3 2.2 4.2-4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol></defs></svg>
<div class="graph" id="g" style="max-width:800px"></div>
<script>
(function(){
  const NS='http://www.w3.org/2000/svg';const el=(t,a={},tx)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(tx!=null)e.textContent=tx;return e};
  const nodes=[{id:'co',label:'拉取代码',sub:'2s',layer:0,state:'done'},{id:'dep',label:'安装依赖',sub:'41s',layer:1,state:'done'},{id:'unit',label:'单元测试',sub:'1m 12s',layer:2,state:'running'},{id:'img',label:'构建镜像',sub:'58s',layer:2,state:'running'},{id:'lint',label:'Lint',sub:'9s',layer:2,state:'done'},{id:'int',label:'集成测试',layer:3,state:'pending'},{id:'appr',label:'人工审批',layer:4,state:'waiting'},{id:'canary',label:'发布到灰度',layer:5,state:'pending'}];
  const edges=[['co','dep','done'],['dep','unit','active'],['dep','img','active'],['dep','lint','done'],['unit','int','pending'],['img','int','pending'],['lint','canary','pending'],['int','appr','pending'],['appr','canary','pending']];
  const lanes=[['build',0,2],['verify',3,4],['release',5,5]];
  const W=112,H=44,GX=60,GY=18,PAD=16,LANE=26;const byLayer={};nodes.forEach(n=>(byLayer[n.layer]||=[]).push(n));
  const layers=Object.keys(byLayer).map(Number).sort((a,b)=>a-b);const maxRows=Math.max(...layers.map(l=>byLayer[l].length));const totalH=maxRows*H+(maxRows-1)*GY;
  layers.forEach(l=>{const col=byLayer[l];const h=col.length*H+(col.length-1)*GY;col.forEach((n,i)=>{n.x=PAD+l*(W+GX);n.y=PAD+LANE+(totalH-h)/2+i*(H+GY)})});
  const width=PAD*2+layers.length*W+(layers.length-1)*GX,height=PAD*2+LANE+totalH;
  const svg=el('svg',{viewBox:'0 0 '+width+' '+height,width,height,role:'img','aria-label':'任务依赖图'});const map=Object.fromEntries(nodes.map(n=>[n.id,n]));
  edges.forEach(([a,b,st])=>{const A=map[a],B=map[b];const x1=A.x+W,y1=A.y+H/2,x2=B.x,y2=B.y+H/2,c=(x2-x1)/2;svg.appendChild(el('path',{d:'M'+x1+','+y1+' C'+(x1+c)+','+y1+' '+(x2-c)+','+y2+' '+x2+','+y2,class:'g-edge '+st}));svg.appendChild(el('path',{d:'M'+(x2-4)+','+(y2-3)+' L'+x2+','+y2+' L'+(x2-4)+','+(y2+3),class:'g-edge '+st,'stroke-dasharray':'0'}))});
  nodes.forEach(n=>{const g=el('g',{class:'g-node '+n.state,transform:'translate('+n.x+','+n.y+')'});g.appendChild(el('rect',{width:W,height:H,rx:6}));g.appendChild(el('use',{href:'#i-'+n.state,x:10,y:n.sub?10:17,width:11,height:11,class:'ic'}));g.appendChild(el('text',{x:26,y:n.sub?19:26},n.label));if(n.sub)g.appendChild(el('text',{x:12,y:34,class:'sub'},n.sub));svg.appendChild(g)});
  lanes.forEach(([label,from,to])=>{const x=PAD+from*(W+GX),w=(to-from+1)*W+(to-from)*GX;svg.appendChild(el('text',{x,y:PAD+9,class:'g-lane'},label.toUpperCase()));svg.appendChild(el('line',{x1:x,y1:PAD+15,x2:x+w,y2:PAD+15,class:'g-laneline'}))});
  const host=document.getElementById('g');host.appendChild(svg);
  const cap=document.createElement('div');cap.className='cap';cap.innerHTML=['done:完成','running:进行中','pending:未开始','waiting:等待人工'].map(s=>{const[k,t]=s.split(':');return '<span class="st '+k+'"><span class="dot"><svg><use href="#i-'+k+'"/></svg></span>'+t+'</span>'}).join('');host.appendChild(cap);
})();
</script>
</body></html>
