<!-- @dsCard group="消息块" height=330 subtitle="四种语义提示框" -->
<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-md);font-weight:var(--fw-body);line-height:var(--lh-body)}</style></head><body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-pending" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol><symbol id="i-running" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".25"/><path d="M6 1.5a4.5 4.5 0 0 1 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol><symbol id="i-done" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="currentColor"/><path d="M3.6 6.2l1.7 1.6 3.2-3.4" fill="none" style="stroke:var(--bg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-failed" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="currentColor"/><path d="M4 4l4 4M8 4l-4 4" style="stroke:var(--bg)" stroke-width="1.5" stroke-linecap="round"/></symbol><symbol id="i-waiting" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 3.3V6l1.9 1.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol><symbol id="i-skipped" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 6h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol><symbol id="i-chev" viewBox="0 0 12 12"><path d="M4 2.5L7.5 6 4 9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-info" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 8v4.5M9 5.5v.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol><symbol id="i-warn" viewBox="0 0 18 18"><path d="M9 2.5l7 12.5H2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 7v3.5M9 13v.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol><symbol id="i-err" viewBox="0 0 18 18"><rect x="2.5" y="2.5" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 6.5l5 5M11.5 6.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol><symbol id="i-ok" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.8 9.3l2.3 2.2 4.2-4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol></defs></svg>
<div style="max-width:var(--measure);display:grid;gap:12px">
<div class="callout info"><svg class="ic"><use href="#i-info"/></svg><div><div class="t">说明</div>feature flag 默认关闭，这一步不影响线上流量。</div></div>
<div class="callout ok"><svg class="ic"><use href="#i-ok"/></svg><div><div class="t">已完成</div>12 个测试全部通过，耗时 14.2s，没有新增 lint 告警。</div></div>
<div class="callout warn"><svg class="ic"><use href="#i-warn"/></svg><div><div class="t">注意</div>你的 AWS 凭证将在 38 分钟后过期。回填预计还需 3 分钟。</div></div>
<div class="callout err"><svg class="ic"><use href="#i-err"/></svg><div><div class="t">失败：迁移未执行</div><code>ER_LOCK_WAIT_TIMEOUT</code>：另一事务持有表锁超过 50s。没有任何数据被修改。</div></div>
</div>
</body></html>
